name: Inception Gate (Provenance)
on: [pull_request]
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Wywiad + WIP=1
        if: hashFiles('docs/tasks/ACTIVE.md') != ''
        run: python3 scripts/docs-provenance.py --check
      - name: Dowod RED bramki (musi blokowac)
        run: python3 scripts/docs-provenance.py --test-red
